name: Test simulator
on:
  push:
  pull_request:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Unit tests (no GPU or network model required)
        run: python -m unittest discover -s tests -v
      - name: Offline dashboard data smoke test
        run: |
          python gambler.py --mode demo --scenario reversal --rounds 20 --change-round 10 --seed 17
          python -c "import json; x=json.load(open('results/latest.json')); assert len(x['rounds'])==20"
